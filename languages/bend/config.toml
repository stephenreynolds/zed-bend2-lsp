name = "Bend"
grammar = "bend2"
path_suffixes = ["bend"]
line_comments = ["# "]
tab_size = 2
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
# Block headers (`def`, `type`, `law`, `match`, `case`, `do`) end in `:`,
# and a lambda body may start on the line after `=>`.
increase_indent_pattern = "^[^#]*(:|=>)\\s*(#.*)?$"
